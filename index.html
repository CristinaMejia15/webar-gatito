<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Prueba NFT Gatito</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js con soporte NFT -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #estado {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 99999;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            padding: 12px 16px;

            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div id="estado">
    🔍 Esperando marcador...
</div>

<a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;
          trackingMethod: best;
          debugUIEnabled: false;">

    <!-- MARCADOR NFT -->
    <a-nft
        id="marcador"
        type="nft"
        url="gatito"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- PRUEBA: CUBO ROJO -->
        <a-box
            position="100 100 -100"
            scale="50 50 50"
            material="color: red; opacity: 1;">
        </a-box>

    </a-nft>

    <a-entity camera></a-entity>

</a-scene>


<script>

    const marcador = document.querySelector("#marcador");
    const estado = document.querySelector("#estado");

    marcador.addEventListener("markerFound", function () {

        estado.innerHTML =
            "✅ ¡GATITO DETECTADO!";

        console.log("NFT encontrado");

    });


    marcador.addEventListener("markerLost", function () {

        estado.innerHTML =
            "🔍 Buscando gatito...";

        console.log("NFT perdido");

    });

</script>

</body>
</html>
