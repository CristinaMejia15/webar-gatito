<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Prueba modelo 3D</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #estado {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div id="estado">🐱 Cargando modelo 3D...</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- MODELO 3D -->
    <a-assets>
        <a-asset-item
            id="gatito3d"
            src="./Cat by Quaternius - qKICY6xla2.glb">
        </a-asset-item>
    </a-assets>

    <!-- GATITO -->
    <a-entity
        id="gatito"
        gltf-model="#gatito3d"
        position="0 -0.5 -3"
        rotation="0 0 0"
        scale="0.15 0.15 0.15">
    </a-entity>

    <!-- CÁMARA -->
    <a-entity camera></a-entity>

</a-scene>

<script>
    const modelo = document.querySelector("#gatito");
    const estado = document.querySelector("#estado");

    modelo.addEventListener("model-loaded", function () {
        estado.innerHTML = "✅ MODELO 3D CARGADO";
    });

    modelo.addEventListener("model-error", function (e) {
        estado.innerHTML = "❌ ERROR AL CARGAR EL MODELO";
        console.error(e);
    });
</script>

</body>
</html>
