
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Práctica WebAR - Gatito 3D</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #estado {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            padding: 12px;

            font-family: Arial, sans-serif;
            font-size: 18px;

            border-radius: 8px;
        }
    </style>
</head>

<body>

<div id="estado">🐱 Cargando modelo 3D...</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ARCHIVO DEL GATITO -->
    <a-assets>

        <a-asset-item
            id="gatito3d"
            src="./Cat by Quaternius - qKICY6xla2.glb">
        </a-asset-item>

    </a-assets>


    <!-- GATITO 3D -->
    <a-entity
        id="gatito"
        gltf-model="#gatito3d"

        position="0 -0.5 -4"

        rotation="0 0 0"

        scale="0.08 0.08 0.08">
    </a-entity>


    <!-- CÁMARA -->
    <a-entity
        id="camara"
        camera>
    </a-entity>

</a-scene>


<script>

    const gatito = document.querySelector("#gatito");
    const estado = document.querySelector("#estado");


    /* ============================
       MODELO CARGADO
       ============================ */

    gatito.addEventListener("model-loaded", function () {

        estado.innerHTML = "✅ MODELO 3D CARGADO";

        ajustarGatito();

        setTimeout(function () {
            estado.style.display = "none";
        }, 2500);

    });


    /* ============================
       ERROR DEL MODELO
       ============================ */

    gatito.addEventListener("model-error", function (e) {

        estado.innerHTML = "❌ ERROR AL CARGAR EL MODELO";

        console.error(e);

    });


    /* ============================
       AJUSTAR TAMAÑO SEGÚN PANTALLA
       ============================ */

    function ajustarGatito() {

        const ancho = window.innerWidth;
        const alto = window.innerHeight;


        /*
        CELULAR VERTICAL
        */

        if (alto > ancho) {

            gatito.setAttribute(
                "scale",
                "0.035 0.035 0.035"
            );

            gatito.setAttribute(
                "position",
                "0 -0.3 -5"
            );

        }


        /*
        LAPTOP / PANTALLA HORIZONTAL
        */

        else {

            gatito.setAttribute(
                "scale",
                "0.18 0.18 0.18"
            );

            gatito.setAttribute(
                "position",
                "0 -0.5 -3"
            );

        }

    }


    /* ============================
       SI GIRAS EL CELULAR
       ============================ */

    window.addEventListener(
        "resize",
        ajustarGatito
    );

</script>

</body>
</html>
