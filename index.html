<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Práctica WebAR</title>

  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arjs-loader div {
      text-align: center;
      font-size: 1.25em;
      color: white;
    }
  </style>
</head>

<body>

  <div class="arjs-loader">
    <div>Cargando Realidad Aumentada... 🐱</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item
        id="gato3d"
        src="Cat%20by%20J-Toastie%20-%208GJbfM8R1A.glb">
      </a-asset-item>
    </a-assets>

    <a-nft
      type="nft"
      url="WhatsApp%20Image%202026-09-13%20at%203.17.00%20PM%20(2)"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity
        gltf-model="#gato3d"
        scale="5 5 5"
        position="150 300 -100">
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
