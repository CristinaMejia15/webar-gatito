<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Prueba NFT Gatito</title>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #estado {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 99999;
            background: black;
            color: white;
            padding: 10px;
            font-family: Arial;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div id="estado">Esperando marcador...</div>

<a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;">

    <a-nft
        id="marcador"
        type="nft"
        url="gatito"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <a-box
            position="150 150 -50"
            scale="50 50 50"
            material="color: red;">
        </a-box>

    </a-nft>

    <a-entity camera></a-entity>

</a-scene>

<script>
    const marcador = document.querySelector("#marcador");
    const estado = document.querySelector("#estado");

    marcador.addEventListener("markerFound", () => {
        estado.innerHTML = "✅ MARCADOR DETECTADO";
    });

    marcador.addEventListener("markerLost", () => {
        estado.innerHTML = "❌ Marcador perdido";
    });
</script>

</body>
</html>
