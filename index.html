<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Prueba marcador NFT</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #estado {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 99999;

            background: rgba(0,0,0,0.85);
            color: white;

            padding: 12px 18px;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div id="estado">
    🔍 Esperando marcador...
</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

    <!-- MARCADOR NFT -->
    <a-nft
        id="marcador"
        type="nft"
        url="./gatito"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- CUBO DE PRUEBA -->
        <a-box
            position="100 100 0"
            scale="50 50 50"
            material="color: red;">
        </a-box>

    </a-nft>

    <a-entity camera></a-entity>

</a-scene>

<script>

    const marcador = document.querySelector("#marcador");
    const estado = document.querySelector("#estado");

    marcador.addEventListener("markerFound", function () {

        estado.innerHTML =
            "✅ ¡FOTO DETECTADA!";

        estado.style.background =
            "rgba(0,120,0,0.9)";
    });

    marcador.addEventListener("markerLost", function () {

        estado.innerHTML =
            "❌ Marcador perdido";

        estado.style.background =
            "rgba(150,0,0,0.9)";
    });

</script>

</body>
</html>
